name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install llm-rosetta (master)
        run: |
          # The parent's test-fixture submodule is addressed as git@github.com:;
          # rewrite it to HTTPS, which the runner can clone without a key.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          # The core is a two-package monorepo since 0.14; without the
          # subdirectory pip clones the repository root, finds no project
          # there and tries a flat-layout build of every directory.
          pip install "llm-rosetta @ git+https://github.com/Oaklight/llm-rosetta.git@master#subdirectory=packages/llm-rosetta"
          # The script has to give up before the gateway kills a token_command,
          # so one test compares against the gateway's COMMAND_TIMEOUT.
          pip install "llm-rosetta-gateway @ git+https://github.com/Oaklight/llm-rosetta.git@master#subdirectory=packages/llm-rosetta-gateway"
      - name: Install the shim package
        run: pip install -e . pytest
      - name: Run tests
        run: pytest tests -q
